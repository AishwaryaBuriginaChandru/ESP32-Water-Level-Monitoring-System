<!DOCTYPE html>
<html lang="en">
<!-- https://www.w3schools.com/howto/tryit.asp?filename=tryhow_html_include_2 -->

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="Aishwarya BC">
    <title>ABC - WIFI</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link href="fontawesome.min.css" rel="stylesheet" type="text/css">
    <link href="bootstrap.css" rel="stylesheet">
</head>

<body id="page-top">
    <div id="loading-indicator">
        <div class="loading-Icon ">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <h3 class="loading-text"> Loading..</h3>
        </div>
    </div>

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <div w3-include-html="sidebar.html"></div>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <div w3-include-html="header.html"></div>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">WIFI MANAGER</h1>
                    </div>
                    <div class="row card border-left-danger shadow h-100 py-2 mb-4" id="MessageBox">
                        <div class="col mr-4 align-items-center" id="MessageBoxMessage">
                            Error
                        </div>
                    </div>
                    <!-- Content Row -->
                    <div class="card border-left-warning shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row">
                                <div class="col mb-3">
                                    <label for="WifiSsid" class="form-label">SSID</label>
                                    <input class="form-control" id="WifiSsid" />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col mb-3">
                                    <label for="WifiPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="WifiPassword" />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <button id="ConnectButton" class="btn btn-sm btn-primary shadow-sm"><i
                                            class="fas fa-link fa-sm text-white-50"></i> Connect</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div w3-include-html="footer.html"></div>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div w3-include-html="LogoutDialog.html"></div>
    <script src="jquery.min.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>includeHTML();</script>
    <script src="wifi.js"></script>
</body>

</html>
